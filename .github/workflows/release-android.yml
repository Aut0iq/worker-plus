name: release-android

# Push a tag like v1.0.1 -> signed APK attached to a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || VERSION="0.0.0"
          node -e "const fs=require('fs'),f='app.json',j=JSON.parse(fs.readFileSync(f));j.expo.version=process.argv[1];j.expo.android.versionCode=Number(process.argv[2]);fs.writeFileSync(f,JSON.stringify(j,null,2))" "$VERSION" "$GITHUB_RUN_NUMBER"
          echo "APK=prila-$VERSION.apk" >> "$GITHUB_ENV"
      - run: npx expo prebuild -p android --no-install
      # shortcut: arm64 only (all current phones); add armeabi-v7a if old 32-bit devices must be supported
      - run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
        working-directory: mobile/android
      - name: Sign APK with release key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias prila \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out "$APK" android/app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --print-certs "$APK" | head -2
          rm "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: prila-apk
          path: mobile/prila-*.apk
      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: mobile/${{ env.APK }}
          generate_release_notes: true
