name: release-android

# Push a tag like v1.0.1 -> signed APK attached to a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job publishes the GitHub Release
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || VERSION="0.0.0"
          node -e "const fs=require('fs'),f='app.json',j=JSON.parse(fs.readFileSync(f));j.expo.version=process.argv[1];j.expo.android.versionCode=Number(process.argv[2]);fs.writeFileSync(f,JSON.stringify(j,null,2))" "$VERSION" "$GITHUB_RUN_NUMBER"
          echo "APK=worker-plus-$VERSION.apk" >> "$GITHUB_ENV"
      # Push notifications need an EAS project id (expo.dev) and Firebase config for
      # Android. Both are optional: without them the APK builds, but has no push.
      - name: Push config (EAS project id, google-services.json)
        env:
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
            echo "GOOGLE_SERVICES_FILE=./google-services.json" >> "$GITHUB_ENV"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret is not set: Android push will not work"
          fi
          [ -n "$EAS_PROJECT_ID" ] && echo "EAS_PROJECT_ID=$EAS_PROJECT_ID" >> "$GITHUB_ENV" \
            || echo "::warning::EAS_PROJECT_ID secret is not set: push token will not be registered"
      - run: npx expo prebuild -p android --no-install
      # all ABIs in one APK: 32/64-bit ARM phones and x86/x86_64 emulators
      - run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64 --no-daemon
        working-directory: mobile/android
      - name: Sign APK with release key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias prila \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out "$APK" android/app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --print-certs "$APK" | head -2
          rm "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: worker-plus-apk
          path: mobile/worker-plus-*.apk
      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: mobile/${{ env.APK }}
          generate_release_notes: true
