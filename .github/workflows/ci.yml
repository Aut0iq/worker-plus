name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prila
          POSTGRES_PASSWORD: prila
          POSTGRES_DB: prila
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prila -d prila"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: server
      - run: cargo test
        working-directory: server
        env:
          DATABASE_URL: postgres://prila:prila@localhost:5432/prila
      - run: git diff --exit-code -- shared/api-types

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
        working-directory: admin
      - run: npm run build
        working-directory: admin
      - run: npm run lint
        working-directory: admin
